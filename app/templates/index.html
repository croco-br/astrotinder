<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Astral</title>
    <link rel="stylesheet" href="{{ static_url(request, 'css/app.css') }}">
    <link rel="stylesheet" href="{{ static_url(request, 'font-awesome-4.7.0/css/font-awesome.min.css') }}">
    <script src="{{ static_url(request, 'js/natal.js') }}" defer></script>
    <script src="{{ static_url(request, 'js/sephiroth.js') }}" defer></script>
    <script src="{{ static_url(request, 'js/index.js') }}" defer></script>
</head>

<body class="min-h-screen bg-[#f6f1e3] text-stone-800 antialiased">
    <section class="page-section">
        <div class="card">
            <nav class="tabs">
                <a href="/" class="tab tab-active">Calcular</a>
                <a href="/glossary" class="tab">Glossário</a>
            </nav>
            <h1 class="h-title text-center mt-4">Mapa Astral</h1>
            <form onsubmit="calculate(); return false;" class="mt-6">
                <fieldset>
                    <legend class="h-subtitle text-center mb-4 w-full">Informações Pessoais</legend>

                    <div class="mb-4">
                        <label class="field-label" for="name">Nome</label>
                        <div class="input-icon-wrap">
                            <input class="input" type="text" id="name" placeholder="Nome" value="John Doe" required>
                            <span class="input-icon"><i class="fa fa-user"></i></span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <div>
                            <label class="field-label" for="birthdate">Data de Nascimento</label>
                            <div class="input-icon-wrap">
                                <input class="input" type="date" id="birthdate" value="1990-06-25" required>
                                <span class="input-icon"><i class="fa fa-calendar"></i></span>
                            </div>
                        </div>

                        <div>
                            <label class="field-label" for="birthtime">Hora de Nascimento</label>
                            <div class="input-icon-wrap">
                                <input class="input" type="time" id="birthtime" value="22:15" required>
                                <span class="input-icon"><i class="fa fa-clock-o"></i></span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="field-label" for="city">Cidade</label>
                        <div class="input-icon-wrap">
                            <input class="input" type="text" id="city" placeholder="Cidade" value="São Paulo" required>
                            <span class="input-icon"><i class="fa fa-map-marker"></i></span>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="field-label" for="method">Método</label>
                        <select id="method" name="options" class="input-plain">
                            <option value="traditional" selected>Astrologia Tradicional (12 Signos)</option>
                            <option value="hermetic">Astrologia Hermética (24 Signos)</option>
                            <option value="angels">Anjos Cabalísticos (72 Signos)</option>
                            <option value="sephiroth">Astrologia Cabalística (Sephiroth)</option>
                            <option value="agathadaimon">Agathadaimon (Nome do Anjo da Guarda)</option>
                        </select>
                    </div>

                    <div class="mt-6">
                        <button id="calculate-button" class="btn-primary" type="submit">
                            Calcular Mapa Astral
                        </button>
                    </div>
                </fieldset>
            </form>
        </div>
    </section>

    <div id="result" class="page-section pt-0">
        <!-- Result will be displayed here -->
    </div>
</body>

</html>
